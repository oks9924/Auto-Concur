name: Auto-Concur ready build
on:
  push:
    branches: [fix/ready-calendar-20260917]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Apply ready update
        run: python tools/apply_ready_update.py
      - name: Install test browser
        run: python -m playwright install chromium
      - name: Test all functions including calendars
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Build Windows executable folder
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name Auto-Concur --collect-submodules src --collect-all playwright --collect-all tksheet launcher_ready.py
      - name: Test the built executable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath '.\dist\Auto-Concur\Auto-Concur.exe' -ArgumentList '--smoke-test' -PassThru -Wait
          if ($p.ExitCode -ne 0) {
            Get-Content '.\dist\Auto-Concur\startup-error.txt' -ErrorAction SilentlyContinue
            throw 'Built executable smoke test failed'
          }
          Get-Content '.\dist\Auto-Concur\smoke-result.json'
      - name: Package ready-to-run files
        run: python tools/package_ready.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Auto-Concur-ready-Windows
          path: |
            Auto-Concur-Windows-20260917.zip
            Auto-Concur-Source-20260917.zip
            test-results.xml
            smoke-result.json
            dist/Auto-Concur/startup-error.txt
          retention-days: 7
