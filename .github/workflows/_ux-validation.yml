name: Workspace UX targeted validation
on:
  push:
    branches: [fix/ux-workspace-20260917]
    paths: ['.ux-payload/**', '_apply_ux.py', '.github/workflows/_ux-validation.yml']
permissions:
  contents: write
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ux-workspace-20260917
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply verified sources
        run: python _apply_ux.py
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Test workflow UI and data preservation
        run: xvfb-run -a python -m pytest -q tests/test_workspace_ux.py tests/test_calendar_ux.py tests/test_worksheet.py tests/test_blank_policy.py tests/test_display_formats.py::test_format_settings_dialog_saves_without_touching_concur --junitxml=ux-results.xml
      - name: Commit verified application sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/workspace_ui.py src/result_viewer.py src/ui_scroll.py src/row_editor.py src/gui.py src/worksheet_editor.py tests/test_workspace_ux.py tests/test_worksheet.py docs/workspace-ux-20260917.md
          git rm -r .ux-payload _apply_ux.py .github/workflows/_ux-validation.yml
          git commit -m 'Apply workflow workspace, row form and read-only result history; targeted tests verified'
          git push origin HEAD:fix/ux-workspace-20260917
          git rev-parse HEAD > ux-verified-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-ux-validation
          path: |
            ux-results.xml
            ux-verified-commit.txt
          retention-days: 3
