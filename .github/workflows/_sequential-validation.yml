name: Per-expense workflow validation
on:
  push:
    branches: [feat/expense-by-expense-20260918]
permissions:
  contents: write
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/expense-by-expense-20260918
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source transfer
        run: python _apply_sequential.py
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run affected regressions
        run: python -m pytest -q tests/test_sequential_workflow.py tests/test_sequential_dom.py tests/test_concur_workflow.py tests/test_concur_ui.py tests/test_execution.py tests/test_blank_policy.py tests/test_report_session.py tests/test_matching.py tests/test_target_matching.py tests/test_user_expense_policy.py tests/test_row_discovery.py --junitxml=sequential-results.xml
      - name: Commit verified code
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/concur_detail.py src/sequential_workflow.py src/concur_rows.py src/concur_driver.py src/fix_expenses.py src/update_concur.py tests/test_sequential_workflow.py tests/test_sequential_dom.py docs/sequential-workflow-20260918.md
          git rm -r .sequential-payload _apply_sequential.py .github/workflows/_sequential-validation.yml
          git commit -m 'Apply per-expense detail workflow and footer exclusion; affected tests passed'
          git push origin HEAD:feat/expense-by-expense-20260918
          git rev-parse HEAD > sequential-verified-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sequential-validation
          include-hidden-files: true
          path: |
            sequential-results.xml
            sequential-verified-commit.txt
            .sequential-payload/
          retention-days: 2
