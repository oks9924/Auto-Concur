name: UX source snapshot
on:
  push:
    branches: [fix/ux-workspace-20260917]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: ux-source
          path: |
            src/
            tests/
            docs/
            *.py
            *.bat
            README.md
            requirements.txt
          retention-days: 1
