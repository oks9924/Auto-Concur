name: Windows full repair validation
on:
  push:
    branches: [fix/windows-ci-download-20260918]
    paths: ['_apply_windows_repair.py', 'src/**', 'tests/**', '.github/workflows/_repair-validation.yml', '.github/workflows/tests.yml']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Apply exact scoped changes
        run: python _apply_windows_repair.py
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install chromium
          python -m pip download --no-deps tksheet==7.6.0 --dest repair-deps
      - name: Run entire Windows suite
        run: python -m pytest -q --capture=sys --junitxml=repair-results.xml
      - name: Repeat GUI initialization and modal regressions
        run: python -m pytest -q --capture=sys tests/test_attendee_defaults.py tests/test_attendee_favorites.py tests/test_ci_tk_cleanup.py tests/test_workspace_ux.py --junitxml=gui-repeat.xml
      - name: Commit verified source only
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests .github/workflows/tests.yml
          git rm _apply_windows_repair.py .github/workflows/_repair-source.yml .github/workflows/_repair-validation.yml
          git commit -m 'Repair GUI test lifecycle and approved policy regressions; add download lifecycle diagnostics'
          git push origin HEAD:fix/windows-ci-download-20260918
          git rev-parse HEAD > repair-verified-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-repair-results
          path: |
            repair-results.xml
            gui-repeat.xml
            repair-verified-commit.txt
            repair-deps/
          retention-days: 2
