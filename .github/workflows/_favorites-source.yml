name: Favorites source snapshot
on:
  push:
    branches: [feat/attendee-favorites-20260918]
    paths: [.github/workflows/_favorites-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip download --no-deps tksheet==7.6.0 -d wheels
      - uses: actions/upload-artifact@v4
        with:
          name: favorites-source
          path: |
            src/
            tests/
            docs/
            wheels/
            *.py
            *.bat
            README.md
            requirements.txt
          retention-days: 1
