name: Validate target-scoped matching
on:
  push:
    branches: [fix/target-scoped-matching-20260917]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/target-scoped-matching-20260917
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Materialize tested sources
        run: |
          python tools/apply_ready_update.py
          if ($LASTEXITCODE -ne 0) { throw 'Calendar update failed' }
          python tools/apply_target_update.py
          if ($LASTEXITCODE -ne 0) { throw 'Target update failed' }
          python -c "from pathlib import Path; from hashlib import sha256; assert sha256(Path('src/target_matching.py').read_text(encoding='utf-8').encode()).hexdigest() == '32e4d080617adb3b02321a453af4210c9dd5c8f7d807bc9a7c254755d6bc2132'; assert sha256(Path('tests/test_target_matching.py').read_text(encoding='utf-8').encode()).hexdigest() == 'fe8625659a1deae65fceccbc3604a8093abcaa0f8f4fd164b72e0ba7d514efb3'"
      - name: Install test browser
        run: python -m playwright install chromium
      - name: Test matching and calendars
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Build single-file executable
        run: python -m PyInstaller --onefile --name Auto-Concur --collect-submodules src --collect-all playwright --collect-all tksheet --noupx --clean --noconfirm launcher_ready.py
      - name: Verify executable startup and calendars
        shell: pwsh
        run: |
          $p = Start-Process -FilePath '.\dist\Auto-Concur.exe' -ArgumentList '--smoke-test' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw 'EXE smoke test failed' }
          Get-Content '.\dist\smoke-result.json'
      - name: Commit verified sources to working branch
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests docs README.md build_exe.bat launcher_ready.py
          git commit -m 'Apply target-scoped matching and calendars: Windows tests and onefile smoke verified'
          if ($LASTEXITCODE -ne 0) { throw 'Commit failed' }
          git push origin HEAD:fix/target-scoped-matching-20260917
          if ($LASTEXITCODE -ne 0) { throw 'Push failed; main was not changed' }
          git rev-parse HEAD | Out-File -Encoding ascii verified-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Auto-Concur-target-scoped-validation
          path: |
            test-results.xml
            dist/smoke-result.json
            dist/startup-error.txt
            verified-commit.txt
          retention-days: 7
