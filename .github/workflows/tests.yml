name: Windows tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install chromium
      # Keep Tcl's native standard handles intact. Python output remains captured;
      # explicit capsys/capfd fixtures and every test assertion still execute.
      - run: python -m pytest -q --capture=sys --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-results
          path: test-results.xml
          retention-days: 7
